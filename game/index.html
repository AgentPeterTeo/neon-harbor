<script>
  // Console-error collector for the headless screenshot checks.
  window.__nh = { errors: [], ready: false };
  window.addEventListener('error', (e) => window.__nh.errors.push(String(e.message || e.error || e)));
  window.addEventListener('unhandledrejection', (e) => window.__nh.errors.push(String(e.reason)));
</script>
